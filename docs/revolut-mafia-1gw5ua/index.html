<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Revolut Founder Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens follow Dealroom's own product styling (developers.dealroom.co): primary blue #3662E3, Inter, a mono accent. */
  :root {
    --brand: #3662e3; --brand-600: #2b51c4; --brand-300: #5a82eb; --brand-50: #eef2fd; --brand-100: #dfe7fb;
    --ink: #0b1533; --ink-2: #2a3452; --muted: #5d6680; --faint: #8a92a8;
    --bg: #f7f8fc; --surface: #ffffff; --surface-2: #fbfcfe; --line: #e5e8f0; --line-2: #eef0f6;
    --stealth: #f26b3a; --stealth-50: #fff1eb; --good: #13865a;
    --r: 14px; --r-lg: 20px;
    --shadow-sm: 0 1px 2px rgba(11,21,51,.05);
    --shadow: 0 1px 2px rgba(11,21,51,.04), 0 6px 20px -6px rgba(11,21,51,.08);
    --shadow-lg: 0 2px 4px rgba(11,21,51,.04), 0 24px 60px -18px rgba(11,21,51,.22);
    --glow-a: rgba(54,98,227,.16); --glow-b: rgba(90,130,235,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: #6b8ff0; --brand-600: #5a82eb; --brand-300: #8eaaf5; --brand-50: #18224a; --brand-100: #1f2c5c;
      --ink: #eef1f8; --ink-2: #ccd3e4; --muted: #99a2ba; --faint: #6f7893;
      --bg: #0a0f1e; --surface: #111831; --surface-2: #0f162c; --line: #222b48; --line-2: #1a2240;
      --stealth: #ff8a5c; --stealth-50: #3a1d12; --good: #43c58c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5); --shadow-lg: 0 24px 60px -18px rgba(0,0,0,.7);
      --glow-a: rgba(54,98,227,.22); --glow-b: rgba(90,130,235,.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --brand: #6b8ff0; --brand-600: #5a82eb; --brand-300: #8eaaf5; --brand-50: #18224a; --brand-100: #1f2c5c;
    --ink: #eef1f8; --ink-2: #ccd3e4; --muted: #99a2ba; --faint: #6f7893;
    --bg: #0a0f1e; --surface: #111831; --surface-2: #0f162c; --line: #222b48; --line-2: #1a2240;
    --stealth: #ff8a5c; --stealth-50: #3a1d12; --good: #43c58c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 Inter, -apple-system, "Segoe UI", sans-serif; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
  .num, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "zero"; }
  .tnum { font-variant-numeric: tabular-nums; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  button { font: inherit; color: inherit; }

  /* Background: faint dot grid + two slow brand-blue glows (moved by Motion) */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg .dots { position: absolute; inset: 0; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px;
              mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%); }
  .bg .g { position: absolute; border-radius: 50%; filter: blur(80px); }
  .bg .g1 { width: 46vmax; height: 46vmax; left: -10vmax; top: -18vmax; background: var(--glow-a); }
  .bg .g2 { width: 38vmax; height: 38vmax; right: -8vmax; top: 10vh; background: var(--glow-b); }

  /* Top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
         background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid transparent; transition: border-color .2s; }
  .bar.scrolled { border-bottom-color: var(--line); }
  .bar .in { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.2px; color: var(--ink); white-space: nowrap; }
  .brand .mk { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
  .brand .sep { color: var(--faint); font-weight: 400; }
  .brand .client { color: var(--muted); font-weight: 500; }
  .nav { position: relative; display: flex; gap: 2px; margin-left: auto; padding: 4px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
  .nav a { position: relative; z-index: 1; padding: 6px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-radius: 99px; text-decoration: none; transition: color .2s; }
  .nav a.on { color: var(--ink); }
  .nav .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 0; border-radius: 99px; background: var(--brand-50); }
  @media (max-width: 760px) { .nav { display: none; } .brand .client, .brand .sep { display: none; } }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 96px; }

  /* Hero */
  .hero { padding: 72px 0 40px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 5px 12px 5px 6px; border-radius: 99px; box-shadow: var(--shadow-sm); }
  .eyebrow .pill { background: var(--brand); color: #fff; border-radius: 99px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; }
  h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; margin: 20px 0 16px; max-width: 900px; }
  h1 .hl { background: linear-gradient(100deg, var(--brand) 10%, var(--brand-300) 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { font-size: clamp(16px, 1.6vw, 18.5px); color: var(--muted); max-width: 640px; margin: 0; line-height: 1.55; }

  .kpis { margin-top: 44px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
  .kpi { padding: 22px 22px 20px; border-left: 1px solid var(--line-2); }
  .kpi:first-child { border-left: 0; }
  .kpi .v { font-size: clamp(26px, 3vw, 34px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .kpi.accent .v { color: var(--brand); }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } .kpi { border-left: 0; border-top: 1px solid var(--line-2); } .kpi:nth-child(-n+2) { border-top: 0; } .kpi:nth-child(even) { border-left: 1px solid var(--line-2); } .kpi:last-child { grid-column: 1 / -1; border-left: 0; } }

  /* Sections */
  section { margin-top: 88px; }
  .sh { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .kicker { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); margin: 0 0 8px; }
  h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 650; letter-spacing: -0.025em; line-height: 1.15; margin: 0; }
  .lead { color: var(--muted); margin: 10px 0 0; max-width: 680px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
  .reveal { opacity: 0; }
  .no-motion .reveal { opacity: 1; }

  /* Segmented controls */
  .seg { position: relative; display: inline-flex; padding: 4px; border-radius: 12px; background: var(--line-2); border: 1px solid var(--line); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; border-radius: 9px; transition: color .2s; white-space: nowrap; }
  .seg button.on { color: var(--ink); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 9px; background: var(--surface); box-shadow: 0 1px 2px rgba(11,21,51,.08), 0 2px 8px -2px rgba(11,21,51,.10); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Orbit */
  .stage { position: relative; padding: 8px; overflow: hidden; }
  .stage .legend { position: absolute; left: 22px; bottom: 18px; display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); z-index: 2; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  #orbit { width: 100%; height: auto; display: block; }
  #orbit text { fill: var(--ink); font-family: Inter, sans-serif; pointer-events: none; }
  #orbit .sub { fill: var(--muted); }
  #orbit .nd { cursor: pointer; outline: none; }
  #orbit .ring { fill: none; stroke: var(--line); stroke-dasharray: 2 7; stroke-linecap: round; }
  #orbit .spoke { stroke: var(--line); stroke-width: 1.25; transition: stroke .2s, stroke-width .2s; }
  #orbit .spoke.hot { stroke: var(--brand); stroke-width: 2; }

  /* Grid of founders */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .pc { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 22px 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
        box-shadow: var(--shadow-sm); color: var(--ink); cursor: pointer; transition: border-color .2s, box-shadow .25s; }
  .pc:hover { border-color: var(--brand-100); box-shadow: var(--shadow); }
  .pc .rank { position: absolute; top: 12px; left: 14px; font-size: 11.5px; color: var(--faint); }
  .pc .st { position: absolute; top: 12px; right: 12px; }
  .pc .cn { font-weight: 600; font-size: 15px; letter-spacing: -.01em; margin-top: 12px; }
  .pc .fn { font-size: 13px; color: var(--muted); }
  .pc .tg { font-size: 12.5px; color: var(--muted); margin: 8px 0 10px; line-height: 1.45; min-height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc .ft { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; font-size: 12px; color: var(--faint); }
  .pc .ft span { white-space: nowrap; }

  /* Avatars */
  .av { position: relative; flex: none; width: var(--s, 72px); height: var(--s, 72px); }
  .av .ph { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-weight: 600; font-size: calc(var(--s, 72px) * .32);
            background: linear-gradient(140deg, var(--brand-300), var(--brand-600)); color: #fff; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line); }
  .av .bd { position: absolute; right: -4px; bottom: -2px; width: calc(var(--s, 72px) * .4); height: calc(var(--s, 72px) * .4); border-radius: 50%; background: #fff; object-fit: contain;
            box-shadow: 0 0 0 2px var(--surface), var(--shadow-sm); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2); overflow: hidden; padding: 2px; }

  /* Chips */
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--line-2); color: var(--ink-2); margin: 3px 4px 0 0; white-space: nowrap; }
  .chip.b { background: var(--brand-50); color: var(--brand); }
  .chip.s { background: var(--stealth-50); color: var(--stealth); }
  .chip.s::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Pipeline charts */
  .two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .panel { padding: 22px 24px; }
  .panel h3 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .panel .sub { color: var(--muted); font-size: 13px; margin: 2px 0 18px; }
  .cols { display: flex; align-items: flex-end; gap: 8px; height: 190px; }
  .cols .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .cols .bar { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--brand-300), var(--brand)); transform-origin: bottom; }
  .cols .bar.zero { background: var(--line); }
  .cols .v { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .cols .m { font-size: 11.5px; color: var(--faint); margin-top: 8px; }
  .hb { display: grid; grid-template-columns: 128px 1fr 28px; gap: 12px; align-items: center; font-size: 13.5px; padding: 6px 0; }
  .hb .t { height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
  .hb .t span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-300)); transform-origin: left; }
  .hb .n { text-align: right; color: var(--ink-2); font-size: 12.5px; }
  .note { font-size: 12.5px; color: var(--faint); margin: 14px 0 0; }

  /* Watchlist */
  .wl { padding: 6px 0; }
  .row { display: grid; grid-template-columns: 44px auto 1fr auto; gap: 18px; align-items: center; padding: 16px 24px; border-top: 1px solid var(--line-2); cursor: pointer; transition: background .2s; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }
  .row .rk { font-size: 13px; color: var(--faint); }
  .row .who { min-width: 0; }
  .row .nm { font-weight: 600; letter-spacing: -.01em; }
  .row .co { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .why { margin-top: 4px; }
  .row .rt { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .row .rt b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
  .score { display: inline-block; width: 64px; height: 4px; border-radius: 99px; background: var(--line-2); overflow: hidden; margin-top: 6px; }
  .score span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  @media (max-width: 700px) { .row { grid-template-columns: auto 1fr; padding: 14px 16px; } .row .rk, .row .rt { display: none; } }
  .more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line-2); }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .2s; }
  .btn:hover { border-color: var(--brand-300); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-600); text-decoration: none; }

  /* Search */
  .search { position: relative; }
  .search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input { width: 100%; font: inherit; font-size: 16px; padding: 16px 18px 16px 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); transition: border-color .2s, box-shadow .2s; }
  .search input:focus { outline: none; border-color: var(--brand-300); box-shadow: 0 0 0 4px var(--brand-50); }
  #results { margin-top: 14px; }
  #results .card { overflow: hidden; }

  /* Tooltip + drawer */
  #tip { position: fixed; z-index: 40; pointer-events: none; max-width: 300px; padding: 10px 12px; font-size: 13px; line-height: 1.45; background: var(--ink); color: var(--bg); border-radius: 10px; box-shadow: var(--shadow-lg); opacity: 0; }
  #tip .m { opacity: .7; }
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(11,21,51,.32); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; }
  .scrim.open { pointer-events: auto; }
  .drawer { position: fixed; z-index: 51; top: 12px; right: 12px; bottom: 12px; width: min(440px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg);
            overflow: auto; transform: translateX(110%); visibility: hidden; }
  .drawer .hd { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 14px 14px 0; background: var(--surface); }
  .drawer .x { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--muted); }
  .drawer .bd2 { padding: 0 28px 28px; }
  .drawer h3 { font-size: 22px; letter-spacing: -.02em; margin: 16px 0 2px; }
  .drawer .loc { color: var(--muted); font-size: 14px; }
  .drawer .blk { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-2); }
  .drawer .lbl { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
  .drawer .co { display: flex; gap: 12px; align-items: center; }
  .drawer .co img, .drawer .co .lg { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 4px; display: grid; place-items: center; font-weight: 700; color: var(--ink-2); }
  .drawer .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .drawer .facts div { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; }
  .drawer .facts span { display: block; font-size: 12px; color: var(--faint); }
  .drawer .facts b { font-weight: 600; font-size: 14.5px; }
  .drawer ul { margin: 0; padding: 0; list-style: none; }
  .drawer li { display: flex; gap: 10px; padding: 6px 0; font-size: 14px; }
  .drawer li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--brand); }
  .drawer .acts { display: flex; gap: 8px; margin-top: 24px; }

  footer { margin-top: 96px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
  .loading { padding: 120px 0; text-align: center; color: var(--muted); }
  .error { color: var(--stealth); }
  @media print { .bar, .bg, .controls { display: none; } body { background: #fff; } .reveal { opacity: 1 !important; } }
</style>
</head>
<body>
<div class="bg"><div class="dots"></div><div class="g g1"></div><div class="g g2"></div></div>

<div class="bar" id="bar"><div class="in">
  <div class="brand"><span class="mk">d</span>dealroom<span class="sep">/</span><span class="client">HV Capital</span></div>
  <nav class="nav" id="nav"><span class="thumb"></span>
    <a href="#orbit-sec">Orbit</a><a href="#pipeline">Pipeline</a><a href="#watchlist">Watchlist</a><a href="#lookup">Search</a>
  </nav>
</div></div>

<div class="wrap">
  <header class="hero">
    <span class="eyebrow reveal" data-r><span class="pill">Founder intelligence</span><span id="asof">Prepared for HV Capital</span></span>
    <h1 class="reveal" data-r>The <span class="hl">Revolut</span> founder map</h1>
    <p class="reveal" data-r>Everyone who left Revolut to start something: what they are building, where, and who is worth a call before the round is announced.</p>
    <div class="kpis reveal" data-r id="kpis"></div>
  </header>
  <div id="app"><div class="loading">Loading Dealroom data…</div></div>
  <footer id="foot"></footer>
</div>

<div id="tip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Founder details"><div class="hd"><button class="x" id="close" aria-label="Close">
  <svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div><div class="bd2" id="dbody"></div></aside>

<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script>
const { animate, inView, stagger } = window.Motion;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (REDUCED) document.documentElement.classList.add("no-motion");
// Motion wrapper: jumps straight to the end state when the viewer prefers reduced motion.
const anim = (el, kf, o = {}) => animate(el, kf, REDUCED ? { ...o, duration: 0, delay: 0 } : o);
const EASE = [0.22, 1, 0.36, 1];
const SPRING = { type: "spring", stiffness: 260, damping: 24 };
// Runs fn once per element, the first time it scrolls into view (Motion 11 passes an IntersectionObserverEntry).
const seen = new WeakSet();
const onView = (target, fn, opts = { amount: 0.25 }) => inView(target, (a) => { const el = a?.target ?? a; if (seen.has(el)) return; seen.add(el); fn(el); }, opts);

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = (n) => n == null ? "n/a" : n >= 1e9 ? `$${(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `$${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)}M` : n >= 1e3 ? `$${Math.round(n / 1e3)}K` : `$${n}`;
const img = (u) => (u ? "https://" + u : null);
const initials = (n) => n.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const stealthName = (v) => /^stealth/i.test(v?.name ?? "");
const label = (p) => (stealthName(p.main) ? p.name : p.main.name);
const REVOLUT_LOGO = "https://storage.googleapis.com/dealroom-images-production/2025/09/21/2e120572df79761e39e343d9aef44b76.png";

let NOW;
function monthsSince(d) { // "2026", "2026-03"
  if (!d) return null;
  const [y, m] = String(d).split("-").map(Number);
  return (NOW.getFullYear() - y) * 12 + (NOW.getMonth() + 1 - (m || 6));
}

// Bucket for a venture: acquired/closed, scaled (25M+), early signal (new and barely funded, or tagged stealth), else building.
function bucket(v) {
  if (!v) return null;
  if (["acquired", "closed", "low_activity"].includes(v.status)) return "gone";
  if ((v.funding ?? 0) >= 25e6 || v.stage === "Breakout stage" || v.stage === "Late stage") return "scaled";
  const age = monthsSince(v.launched);
  if (v.stealth || (age != null && age <= 24 && (v.funding ?? 0) < 5e6)) return "early";
  return "building";
}

// Why a founder is worth a call now. Higher score = earlier and stronger.
function watch(p) {
  const v = p.main, why = []; let s = 0;
  if (!v || bucket(v) !== "early") return { s: 0, why };
  const age = monthsSince(v.launched);
  if (v.stealth) { s += 25; why.push("Tagged stealth startup"); }
  if (age != null && age <= 12) { s += 20; why.push(`Launched ${v.launched}`); } else if (age != null && age <= 24) { s += 10; why.push(`Launched ${v.launched}`); }
  if (!v.funding) { s += 10; why.push("No funding recorded yet"); } else { s += 5; why.push(`${usd(v.funding)} raised so far`); }
  if (p.labels.includes("super_founder")) { s += 15; why.push("Super founder: built a company at scale before"); }
  else if (p.labels.includes("serial_founder")) { s += 10; why.push("Serial founder"); }
  else if (p.labels.includes("strong_founder")) { s += 8; why.push("Strong founder"); }
  else if (p.labels.includes("promising_founder")) { s += 6; why.push("Promising founder"); }
  if (p.revolut && p.revolut.end && Number(p.revolut.end) >= NOW.getFullYear() - 1) { s += 8; why.push(`Left Revolut ${p.revolut.end}`); }
  if (v.employeeGrowth1y > 0.3) { s += 5; why.push("Headcount growing"); }
  s += (p.signal ?? 0) / 10;
  return { s, why };
}
const proven = (p) => ["super_founder", "serial_founder", "strong_founder"].some((l) => p.labels.includes(l));

const avatar = (p, size = 72) => {
  const im = img(p.image), vi = img(p.main?.image);
  return `<div class="av" style="--s:${size}px">${im ? `<img class="ph" src="${im}" alt="" loading="lazy">` : `<div class="ph">${esc(initials(p.name))}</div>`}${
    p.main ? (vi ? `<img class="bd" src="${vi}" alt="" loading="lazy">` : `<div class="bd">${esc(p.main.name[0])}</div>`) : ""}</div>`;
};

function render(d) {
  NOW = new Date(d.generatedAt);
  const P = d.people;
  P.forEach((p) => { p._b = bucket(p.main); p._w = watch(p); });

  $("#app").innerHTML = `

      <div class="controls">

      <div class="cards" id="gridBox" style="display:none"></div>
    </div>
  </section>

  <section id="pipeline">
    <div class="sh reveal" data-r><div><p class="kicker">02 · Pipeline</p><h2>When they launched, and where</h2>
      <p class="lead">Early-signal founders only. A steady flow of new companies each month, concentrated in London.</p></div></div>
    <div class="two">
      <div class="card panel reveal" data-r><h3>Companies launched per month</h3><p class="sub">Last 12 months</p><div class="cols" id="months"></div><p class="note" id="monthNote"></p></div>
      <div class="card panel reveal" data-r><h3>Where they are based</h3><p class="sub">Top 8 countries</p><div id="countries"></div></div>

    h += `<circle class="pulse" cx="${cx}" cy="${cy}" r="92" fill="none" stroke="var(--brand)" stroke-width="1.5" opacity="0"/>

    h += nodes.map((n, i) => { const p = n.p, v = p.main, im = img(p.image), vi = img(v.image), st = v.stealth || stealthName(v), name = label(p);
      return `<g class="nd" data-i="${i}" transform="translate(${n.x} ${n.y})" tabindex="0" role="button" aria-label="${esc(p.name)}"><g class="in">
        <clipPath id="c${i}"><circle r="34"/></clipPath>

        <text y="62" text-anchor="middle" font-size="13" font-weight="600">${esc(name.length > 22 ? name.slice(0, 21) + "…" : name)}</text>

    svg.innerHTML = h;

    // Entrance: rings and spokes draw, core pops, nodes spring out ring by ring
    $$(".ring", svg).forEach((el, i) => anim(el, { opacity: [0, 1], transform: ["scale(.85)", "scale(1)"] }, { duration: 0.9, delay: 0.1 + i * 0.12, ease: EASE }));
    $$(".ring", svg).forEach((el) => (el.style.transformOrigin = `${cx}px ${cy}px`));
    $$(".spoke", svg).forEach((el) => { const len = Math.hypot(el.x2.baseVal.value - cx, el.y2.baseVal.value - cy); el.style.strokeDasharray = len; el.style.strokeDashoffset = len;
      anim(el, { strokeDashoffset: [len, 0] }, { duration: 0.8, delay: 0.35 + nodes[el.dataset.i].ri * 0.15 + Math.random() * 0.1, ease: EASE }); });
    const core = $(".core", svg); core.style.transformOrigin = `${cx}px ${cy}px`;
    anim(core, { opacity: [0, 1], transform: ["scale(.6)", "scale(1)"] }, { ...SPRING, delay: 0.05 });
    const inner = $$(".nd .in", svg);
    inner.forEach((el, i) => anim(el, { opacity: [0, 1], transform: ["scale(.3)", "scale(1)"] }, { ...SPRING, delay: 0.45 + nodes[i].ri * 0.16 + (i % 9) * 0.03 }));
    // Ambient life: a soft pulse from the core and slowly drifting ring dashes

      const off = () => { sp.classList.remove("hot"); anim(el, { transform: "scale(1)" }, { type: "spring", stiffness: 300, damping: 22 }); hideTip(); };
      g.addEventListener("mouseenter", on); g.addEventListener("mousemove", (e) => showTip(e, p)); g.addEventListener("mouseleave", off);
      g.addEventListener("focus", on); g.addEventListener("blur", off);

  }

  $$("#months .bar, #countries .t span").forEach((el) => (el.style.transform = el.classList.contains("bar") ? "scaleY(0)" : "scaleX(0)"));
  onView("#months", () => anim($$("#months .bar"), { transform: ["scaleY(0)", "scaleY(1)"] }, { duration: 0.7, delay: stagger(0.045), ease: EASE }));
  onView("#countries", () => anim($$("#countries .t span"), { transform: ["scaleX(0)", "scaleX(1)"] }, { duration: 0.8, delay: stagger(0.06), ease: EASE }));

  // ---- Watchlist -------------------------------------------------------------------------------
  const rowHtml = (p) => { const v = p.main, st = v.stealth || stealthName(v);
    return `<div class="row" tabindex="0" role="button" data-id="${p.id}">

  const byId = Object.fromEntries(P.map((p) => [p.id, p]));
  const bindRows = (root) => $$(".row", root).forEach((el) => { el.addEventListener("click", () => openDrawer(byId[el.dataset.id])); el.addEventListener("keydown", (e) => { if (e.key === "Enter") openDrawer(byId[el.dataset.id]); }); });

      .sort((a, b) => (b._w.s - a._w.s) || ((b.signal ?? -1) - (a.signal ?? -1)));
    out.innerHTML = rows.length ? `<div class="card wl">${rows.slice(0, 8).map((p) => p.main ? rowHtml({ ...p, _rank: p._rank ?? "–" }) : "").join("")}</div>
      ${rows.length > 8 ? `<p class="note">Showing 8 of ${rows.length}. Refine the search to narrow it down.</p>` : ""}` : `<p class="note">No founder matches “${esc(q)}”.</p>`;
    bindRows(out);
    anim($$(".row", out), { opacity: [0, 1], y: [8, 0] }, { duration: 0.3, delay: stagger(0.03), ease: EASE });
  }, 120); });

  // ---- Drawer ------------------------------------------------------------------------------------
  const drawer = $("#drawer"), scrim = $("#scrim");
  window.openDrawer = (p) => {
    hideTip();
    const v = p.main, r = p.revolut, st = v && (v.stealth || stealthName(v));
    const others = p.ventures.filter((x) => x.id !== v?.id);
    $("#dbody").innerHTML = `
      ${avatar(p, 84)}
      <h3>${esc(p.name)}</h3><div class="loc">${esc(p.location ?? "Location not recorded")}${p.signal != null ? ` · Dealroom signal <span class="mono">${p.signal}</span>` : ""}</div>
      <div style="margin-top:10px">${st ? `<span class="chip s">Stealth</span>` : ""}${p.labels.map((l) => `<span class="chip b">${esc(l.replace("_", " "))}</span>`).join("")}${p.backgrounds.slice(0, 2).map((b) => `<span class="chip">${esc(b)}</span>`).join("")}</div>
      ${p._w.why.length ? `<div class="blk"><div class="lbl">Why now</div><ul>${p._w.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
      ${v ? `<div class="blk"><div class="lbl">${v.current ? "Building now" : "Last company"}</div>
        <div class="co">${img(v.image) ? `<img src="${img(v.image)}" alt="">` : `<div class="lg">${esc(v.name[0])}</div>`}<div><b>${esc(st ? "Stealth startup" : v.name)}</b><div class="loc">${esc(v.role ?? "Founder")}</div></div></div>
        ${v.tagline ? `<p style="margin:12px 0 0;color:var(--ink-2)">${esc(v.tagline)}</p>` : ""}
        <div class="facts"><div><span>Raised</span><b class="mono">${v.funding ? usd(v.funding) : "None recorded"}</b></div><div><span>Launched</span><b class="mono">${esc(v.launched ?? "n/a")}</b></div>
          <div><span>Based in</span><b>${esc([v.city, v.country].filter(Boolean).join(", ") || "n/a")}</b></div><div><span>Sector</span><b>${esc(v.industry ?? "n/a")}</b></div></div></div>` : ""}
      <div class="blk"><div class="lbl">At Revolut</div><div>${r ? `${esc(r.title ?? "Role not recorded")} <span class="mono" style="color:var(--muted)">${esc([r.start, r.end].filter(Boolean).join("–"))}</span>` : "Role not in the profile preview"}</div></div>
      ${others.length ? `<div class="blk"><div class="lbl">Also founded</div><div>${others.map((o) => `<span class="chip">${esc(o.name)}</span>`).join("")}</div></div>` : ""}
      <div class="acts"><a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">Open in Dealroom</a>${p.linkedin ? `<a class="btn" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}</div>`;
    drawer.style.visibility = "visible"; scrim.classList.add("open");
    anim(scrim, { opacity: 1 }, { duration: 0.25 });
    anim(drawer, { transform: ["translateX(110%)", "translateX(0%)"] }, { type: "spring", stiffness: 280, damping: 32 });
    anim($$("#dbody > *"), { opacity: [0, 1], y: [10, 0] }, { duration: 0.4, delay: stagger(0.035, { startDelay: 0.08 }), ease: EASE });
    $("#close").focus();
  };
  const closeDrawer = async () => {
    if (!scrim.classList.contains("open")) return;
    scrim.classList.remove("open");
    anim(scrim, { opacity: 0 }, { duration: 0.2 });
    await anim(drawer, { transform: "translateX(110%)" }, { duration: 0.28, ease: [0.4, 0, 1, 1] });
    drawer.style.visibility = "hidden";
  };
  $("#close").addEventListener("click", closeDrawer); scrim.addEventListener("click", closeDrawer);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  // ---- Reveal on scroll, nav highlight, sticky bar ----------------------------------------------
  onView("#app [data-r]", (el) => anim(el, { opacity: [0, 1], y: [18, 0] }, { duration: 0.7, ease: EASE }), { amount: 0.15 });
  const nav = $("#nav"), navThumb = $(".thumb", nav), links = $$("a", nav);
  const setNav = (id) => { const a = links.find((l) => l.hash === "#" + id); if (!a || a.classList.contains("on")) return;
    links.forEach((l) => l.classList.toggle("on", l === a)); anim(navThumb, { x: a.offsetLeft - 4, width: a.offsetWidth }, SPRING); };
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && setNav(e.target.id)), { rootMargin: "-45% 0px -50% 0px" });
  ["orbit-sec", "pipeline", "watchlist", "lookup"].forEach((id) => io.observe(document.getElementById(id)));

  $("#foot").innerHTML = `<div><b>Source:</b> Dealroom API. People who worked at Revolut, hold a founder role and no longer work there, plus the companies they founded. Data as of ${esc(d.generatedAt)}.</div>
    <div><b>Caveats:</b> “worked at Revolut” also includes advisers and board members. Profiles preview at most 5 roles, so some ventures may be missing. “No funding recorded” can also mean undisclosed.</div>`;
}

// Hero entrance and ambient background run straight away
anim($$(".hero [data-r]"), { opacity: [0, 1], y: [20, 0] }, { duration: 0.8, delay: stagger(0.08, { startDelay: 0.05 }), ease: EASE });
if (!REDUCED) {
  animate(".bg .g1", { x: ["0vw", "14vw"], y: ["0vh", "10vh"], scale: [1, 1.15] }, { duration: 22, repeat: Infinity, repeatType: "mirror", ease: "easeInOut" });
  animate(".bg .g2", { x: ["0vw", "-12vw"], y: ["0vh", "16vh"], scale: [1, 0.9] }, { duration: 28, repeat: Infinity, repeatType: "mirror", ease: "easeInOut" });
}
addEventListener("scroll", () => $("#bar").classList.toggle("scrolled", scrollY > 8), { passive: true });

fetch("revolut-mafia.json").then((r) => r.json()).then((d) => { if (d.error) throw new Error(d.error); render(d); })
  .catch((e) => { $("#app").innerHTML = `<div class="loading error">Could not load: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
