<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aix-Marseille-Provence Innovation Ecosystem</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14202e; --muted: #5b6b7d; --line: #e2e7ee;
    --accent: #0b6bcb; --accent2: #e07a1f; --good: #1a8a5a; --bar: #cfe0f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e141b; --card: #151d27; --ink: #e8eef5; --muted: #93a3b5; --line: #243040;
            --accent: #5aa6f0; --accent2: #f0a35a; --good: #4cc790; --bar: #22456b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); }
  section { margin-top: 28px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 0 0 6px; }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .findings { border-left: 4px solid var(--accent); }
  .findings ol { margin: 6px 0 0; padding-left: 20px; } .findings li { margin-bottom: 6px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .kpi .l { color: var(--muted); font-size: 12px; line-height: 1.3; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  a { color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--bar); color: var(--ink); margin-left: 4px; }
  .tag.local { background: var(--good); color: #fff; margin: 0 4px 0 0; }
  .muted { color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .col .bar { width: 100%; max-width: 40px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col .bar.alt { background: var(--accent2); }
  .col .val { font-size: 10.5px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }
  .col .lab { font-size: 11.5px; margin-top: 3px; }
  .sectors { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; }
  ul.actions { padding-left: 20px; margin: 6px 0 0; } ul.actions li { margin-bottom: 4px; }
  .about { font-size: 12.5px; color: var(--muted); }
  .error, .loading { padding: 40px; text-align: center; color: var(--muted); }
  @media print { body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Aix-Marseille-Provence innovation ecosystem</h1>
    <p id="sub">Performance report for the Mayor.</p>
  </header>
  <div id="app"><div class="loading">Loading the ecosystem data...</div></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v == null ? "n/a" : Math.round(v).toLocaleString("en-GB"));
const usd = (v) => {
  if (v == null) return "n/a";
  const a = Math.abs(v);
  if (a >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return "$" + (v / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "M";
  if (a >= 1e3) return "$" + Math.round(v / 1e3) + "K";
  return "$" + Math.round(v);
};
const pct = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "n/a");
const link = (name, url) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)}</a>` : esc(name));
const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);

function bars(rows, key, label, fmt, alt) {
  const max = Math.max(1, ...rows.map((r) => r[key] || 0));
  return `<div class="chart">${rows.map((r) =>
    `<div class="col"><div class="val">${fmt(r[key])}</div><div class="bar${alt ? " alt" : ""}" style="height:${Math.max(1, Math.round(((r[key] || 0) / max) * 105))}px"></div><div class="lab">${esc(r[label])}</div></div>`).join("")}</div>`;
}
function table(cols, rows) {
  return `<div class="scroll"><table><thead><tr>${cols.map((c) => `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.n ? "n" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function render(d) {
  const k = d.kpis, from = d.territory.fromYear, thisYear = new Date().getFullYear();
  const cre = d.creation, fy = d.fundingByYear;
  const recentFull = cre.filter((y) => y.year >= from && y.year < thisYear);
  const base = cre.filter((y) => y.year >= 2015 && y.year <= 2020);
  const recentAvg = recentFull.length ? sum(recentFull, (y) => y.created) / recentFull.length : 0;
  const baseAvg = base.length ? sum(base, (y) => y.created) / base.length : 0;
  const localDeals = sum(d.investors.filter((i) => i.local), (i) => i.deals), allDeals = sum(d.investors, (i) => i.deals);
  const top = d.success.topFunded[0];
  const topShare = top && k.totalFunding ? top.funding / k.totalFunding : 0;
  const bio = d.sectors.find((s) => /Biotech/.test(s.name));
  const thin = d.sectors.filter((s) => s.companies < 30).map((s) => s.name.toLowerCase());
  const lead = d.universities[0];
  const accel = d.accelerators.filter((a) => a.portfolio > 3);
  const accelFunding = sum(accel, (a) => a.portfolioFunding);

  // Three findings, each tied to one number from the data.
  const findings = [
    `<b>Growth capital comes mostly from outside.</b> ${usd(k.vcAmount)} of VC went into local companies since ${from} (${num(k.vcRounds)} rounds), but only ${pct(localDeals, allDeals)} of the deals by the 25 most active investors come from local investors.${topShare > 0.2 ? ` ${esc(top.name)} alone is ${pct(top.funding, k.totalFunding)} of all funding ever raised.` : ""}`,
    `<b>Creation has slowed.</b> About ${Math.round(recentAvg)} companies founded per year since ${from}, against ${Math.round(baseAvg)} per year in 2015-2020 (recent years are partly a data lag).`,
    `<b>The science base is the strength.</b> ${bio ? num(bio.companies) + " biotech and health companies" : "Biotech and health"}${lead ? `, and ${esc(lead.name)} alumni founded ${num(lead.localCompanies)} local companies` : ""}. ${thin.length ? "Thin spots: " + esc(thin.join(", ")) + "." : ""}`,
  ];

  const recs = [
    "Set up a metropolitan seed and growth co-investment fund with Region Sud Investissement and Bpifrance to keep follow-on rounds local.",
    "Create a spin-out maturation programme linking university labs and schools to the incubators.",
    "Open public and anchor-corporate procurement (port, logistics, health) to local startups.",
    `Launch focused programmes for the thin sectors (${esc(thin.join(", ") || "marine, space, cyber")}).`,
    "Publish this dashboard every year as the ecosystem scorecard.",
  ];

  $("#sub").textContent = `Performance report for the Mayor: ${d.territory.name}, ${from} to today.`;

  $("#app").innerHTML = `
  <div class="card findings"><b>Three findings</b><ol>${findings.map((f) => `<li>${f}</li>`).join("")}</ol></div>

  <section><div class="grid kpis">
    ${[
      [num(k.companies), "companies tracked"],
      [num(k.createdSince), `founded since ${from}`],
      [usd(k.vcAmount), `VC raised since ${from}`],
      [num(k.exits5y), `exits since ${from}`],
      [num(k.unicorns), "unicorns and thoroughbreds"],
      [num(k.accelerators), "accelerators and incubators"],
    ].map(([v, l]) => `<div class="card kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`).join("")}
  </div></section>

  <section><h2>Creation and funding</h2>
    <div class="grid two">
      <div class="card"><h3>Companies founded per year</h3>${bars(cre.filter((y) => y.year >= 2017), "created", "year", num)}</div>
      <div class="card"><h3>VC raised per year (USD, ${num(k.vcRounds)} rounds since ${from})</h3>${bars(fy, "amount", "year", usd, true)}</div>
    </div>
    <div class="sectors">${[...d.sectors].sort((a, b) => b.funding - a.funding).map((s) => `<span><b>${esc(s.name)}</b>: ${num(s.companies)} companies, ${usd(s.funding)}</span>`).join("")}</div>
  </section>

  <section><h2>Universities and incubators</h2>
    <div class="grid two">
      <div class="card"><h3>Top 5 schools by local companies founded by alumni</h3>${table([
        { h: "School", f: (u) => `${link(u.name, u.url)}${u.campusBased ? `<span class="tag">campus</span>` : ""}` },
        { h: "Companies", n: 1, f: (u) => num(u.localCompanies) },
        { h: "Spin-outs", n: 1, f: (u) => num(u.localSpinouts) },
      ], d.universities.slice(0, 5))}</div>
      <div class="card"><h3>Top 5 accelerators and incubators by portfolio funding</h3>${table([
        { h: "Structure", f: (a) => link(a.name, a.url) },
        { h: "Companies", n: 1, f: (a) => num(a.portfolio) },
        { h: "Raised", n: 1, f: (a) => usd(a.portfolioFunding) },
        { h: "Jobs", n: 1, f: (a) => num(a.portfolioJobs) },
        { h: "Exits", n: 1, f: (a) => num(a.portfolioExits) },
      ], accel.slice(0, 5))}</div>
    </div>
  </section>

  <section><h2>Most active investors</h2>
    <div class="card">${table([
      { h: "Investor", f: (i) => link(i.name, i.url) },
      { h: "Type", f: (i) => esc(i.types.slice(0, 1).join("")) },
      { h: "Based in", f: (i) => (i.local ? `<span class="tag local">local</span>` : "") + esc([i.city, i.country].filter(Boolean).join(", ")) },
      { h: "Deals", n: 1, f: (i) => num(i.deals) },
      { h: "Lead", n: 1, f: (i) => num(i.leads) },
    ], d.investors.slice(0, 10))}</div>
  </section>

  <section><h2>Success stories</h2>
    <div class="grid three">
      <div class="card"><h3>Most funding raised</h3>${table([
        { h: "Company", f: (c) => link(c.name, c.url) }, { h: "Raised", n: 1, f: (c) => usd(c.funding) },
      ], d.success.topFunded.slice(0, 5))}</div>
      <div class="card"><h3>Most jobs (funded startups)</h3>${table([
        { h: "Company", f: (c) => link(c.name, c.url) }, { h: "Staff", n: 1, f: (c) => num(c.employees) },
      ], d.success.topJobs.slice(0, 5))}</div>
      <div class="card"><h3>Latest exits (${num(d.exits.total)} since ${from})</h3>${table([
        { h: "Company", f: (e) => link(e.company, e.url) }, { h: "Date", n: 1, f: (e) => esc(e.date) },
      ], d.exits.items.slice(0, 5))}</div>
    </div>
  </section>

  <section><h2>Recommendations</h2>
    <div class="card"><ul class="actions">${recs.map((r) => `<li>${r}</li>`).join("")}</ul></div>
  </section>

  <section><div class="card about"><b>About this data.</b> Source: Dealroom API, amounts in USD, generated ${esc(new Date(d.generatedAt).toLocaleDateString("en-GB"))}. Territory: companies founded or headquartered in the Aix-Marseille-Provence Metropole.
    Recent years are understated while Dealroom's coverage catches up, and closures are under-recorded.
    "Campus" marks schools headquartered elsewhere with a campus here; their ranking counts only local companies founded by alumni (at least ${d.universityMinLocalCompanies ?? 5}), and spin-outs are those founded by alumni, a proxy.
    Accelerator portfolios include companies from outside the territory. Investors are ranked by deal count; round amounts are not split between co-investors.
    Sectors overlap. Technopoles, science parks and subsea cables are not in Dealroom, so infrastructure is not covered here.
    ${d.warnings.length ? "<br>Some blocks could not be loaded: " + esc(d.warnings.join("; ")) : ""}</div></section>`;
}

fetch("/api/marseille-aix-naecaj")
  .then((r) => r.json().then((b) => (r.ok ? b : Promise.reject(new Error(b.error || r.status)))))
  .then(render)
  .catch((e) => { $("#app").innerHTML = `<div class="error">Could not load the report: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
